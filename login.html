<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAKS SYSTEM · LOGIN</title>
  <link rel="icon" type="image/png" href="DSLOGO.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="login-styles.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  
  <!-- Firebase Config INLINE -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMKpB_BwOQ_KxwUKI9va-l3ND_n5FQQQbE",
      authDomain: "dsmanagement-bb22c.firebaseapp.com",
      projectId: "dsmanagement-bb22c",
      storageBucket: "dsmanagement-bb22c.firebasestorage.app",
      messagingSenderId: "917825703936",
      appId: "1:917825703936:web:657a3024ef2a66580d48e5"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    window.auth = auth;
    window.db = db;
    console.log('✅ Firebase initialized');
  </script>
</head>
<body>
  <div class="login-container">
    <div class="login-box" id="loginBox">
      <div class="login-header">
        <i class="fas fa-crown login-logo"></i>
        <h1>DAKS SYSTEM</h1>
        <p>Admin Portal Login</p>
      </div>
      
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="loginEmail" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="loginPassword" required placeholder="Enter your password">
            <button type="button" class="password-toggle-btn" onclick="togglePassword('loginPassword', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="auth-btn">Login</button>
      </form>
      
      <div class="auth-footer">
        <p>Don't have an account? <a href="#" onclick="showRegister()">Register here</a></p>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Website</a>
      </div>
      
      <div id="loginError" class="error-message" style="display:none;"></div>
    </div>

    <div class="login-box" id="registerBox" style="display:none;">
      <div class="login-header">
        <i class="fas fa-user-plus login-logo"></i>
        <h1>REGISTER</h1>
        <p>Create Admin Account</p>
      </div>
      
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Full Name</label>
          <input type="text" id="registerName" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="registerEmail" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="registerPassword" required placeholder="Create a password" minlength="8">
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Confirm Password</label>
          <input type="password" id="registerConfirmPassword" required placeholder="Confirm your password">
        </div>
        <div class="form-group">
          <label><i class="fas fa-key"></i> Access Code (Required)</label>
          <input type="text" id="accessCode" required placeholder="Enter access code">
        </div>
        <button type="submit" class="auth-btn">Create Account</button>
      </form>
      
      <div class="auth-footer">
        <p>Already have an account? <a href="#" onclick="showLogin()">Login here</a></p>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Website</a>
      </div>
      
      <div id="registerError" class="error-message" style="display:none;"></div>
      <div id="registerSuccess" class="success-message" style="display:none;"></div>
    </div>
  </div>

  <script src="auth-script.js"></script>
</body>
</html>
