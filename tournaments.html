<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAKS SYSTEM · TOURNAMENTS</title>
  <link rel="icon" type="image/png" href="DSLOGO.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  
  <!-- Firebase Config INLINE -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMKpB_BwOQ_KxwUKI9v-l3ND_n5FQQQbE",
      authDomain: "dsmanagement-bb22c.firebaseapp.com",
      projectId: "dsmanagement-bb22c",
      storageBucket: "dsmanagement-bb22c.firebasestorage.app",
      messagingSenderId: "917825703936",
      appId: "1:917825703936:web:657a3024ef2a66580d48e5"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    window.auth = auth;
    window.db = db;
  </script>
</head>
<body>
  <div class="container">
    <!-- Navigation -->
    <nav class="navbar">
      <div class="logo-area">
        <img src="DSLOGO.jpg" alt="DS Logo" style="width:45px;height:45px;object-fit:contain;border-radius:8px;" onerror="this.style.display='none'">
        <div class="logo-text">DAKS<span>.</span></div>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html#teams" class="nav-link">Teams</a>
        <a href="tournaments.html" class="nav-link" style="color:#d4af37;">Tournaments</a>
      </div>
      <div class="nav-actions">
        <div class="founder-badge">FOUNDER · MYLYKES</div>
        <a href="admin.html" class="login-link" id="adminPanelBtn" style="display:none;">Admin Panel</a>
        <a href="login.html" class="login-link" id="loginBtn">Admin</a>
      </div>
    </nav>

    <!-- Page Header -->
    <div style="text-align:center;padding:3rem 1rem;">
      <i class="fas fa-trophy" style="font-size:4rem;color:#d4af37;filter:drop-shadow(0 0 20px rgba(212,175,55,0.5));"></i>
      <h1 style="font-size:2.5rem;color:#f5f1e6;margin-top:1rem;font-weight:800;">TOURNAMENT <span style="color:#d4af37;">CENTER</span></h1>
      <p style="color:#999;margin-top:0.5rem;">Live brackets and tournament history</p>
      <div style="width:100px;height:3px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:1.5rem auto;"></div>
    </div>

    <!-- Tabs -->
    <div style="display:flex;justify-content:center;gap:1rem;margin-bottom:3rem;flex-wrap:wrap;">
      <button class="tab-btn active" onclick="switchTab('current', event)" style="padding:0.8rem 2rem;">LIVE BRACKET</button>
      <button class="tab-btn" onclick="switchTab('upcoming', event)" style="padding:0.8rem 2rem;">UPCOMING</button>
      <button class="tab-btn" onclick="switchTab('past', event)" style="padding:0.8rem 2rem;">PAST BRACKETS</button>
    </div>

    <!-- Current Tournament Bracket -->
    <div id="currentTab">
      <div id="currentBracket">
        <p style="color:#999;text-align:center;padding:3rem;">Loading live bracket...</p>
      </div>
    </div>

    <!-- Upcoming Tournaments -->
    <div id="upcomingTab" style="display:none;">
      <div id="upcomingList">
        <p style="color:#999;text-align:center;padding:3rem;">Loading upcoming tournaments...</p>
      </div>
    </div>

    <!-- Past Tournament Brackets -->
    <div id="pastTab" style="display:none;">
      <div id="pastBrackets">
        <p style="color:#999;text-align:center;padding:3rem;">Loading past brackets...</p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer" style="margin-top:4rem;">
      <div>© 2023 DAKS SYSTEM · All rights reserved</div>
      <div>Premium Management & Esports Organization</div>
    </footer>
  </div>

  <script>
    function checkSession() {
      const session = localStorage.getItem('daksSystemSession');
      if (session) {
        document.getElementById('adminPanelBtn').style.display = 'flex';
        document.getElementById('loginBtn').style.display = 'none';
      }
    }

    // Load Current Tournament (Active) - Challonge Bracket
    async function loadCurrentTournament() {
      const bracket = document.getElementById('currentBracket');
      try {
        const snapshot = await db.collection('tournaments').where('status', '==', 'active').get();
        
        if (snapshot.empty) {
          bracket.innerHTML = `
            <div style="text-align:center;padding:3rem;background:#1a1a1a;border-radius:1rem;border:1px solid rgba(212,175,55,0.2);">
              <i class="fas fa-gamepad" style="font-size:3rem;color:#666;"></i>
              <p style="color:#999;margin-top:1rem;">No active tournament at the moment</p>
            </div>
          `;
          return;
        }
        
        bracket.innerHTML = '';
        snapshot.forEach(doc => {
          const t = doc.data();
          if (t.challongeUrl) {
            let url = t.challongeUrl.trim().replace(/\/$/, '');
            if (!url.includes('/module')) url += '/module';
            
            bracket.innerHTML = `
              <div style="background:#111;border:2px solid #d4af37;border-radius:1rem;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.5);">
                <div style="padding:1.2rem;text-align:center;border-bottom:2px solid #d4af37;background:linear-gradient(135deg,#1a1a1a,#0b0b0b);">
                  <h3 style="color:#d4af37;margin:0;font-size:1.3rem;">🏆 ${t.name}</h3>
                  <p style="color:#999;margin:0.3rem 0 0;font-size:0.85rem;">${t.startDate} - ${t.endDate}</p>
                </div>
                <iframe src="${url}" width="100%" height="600" frameborder="0" scrolling="auto" allowtransparency="true" style="display:block;background:white;border:none;"></iframe>
              </div>
            `;
          } else {
            bracket.innerHTML = `
              <div style="text-align:center;padding:3rem;background:#1a1a1a;border-radius:1rem;">
                <h3 style="color:#d4af37;">${t.name}</h3>
                <p style="color:#999;">Bracket URL not set</p>
              </div>
            `;
          }
        });
      } catch (error) {
        bracket.innerHTML = '<p style="color:red;">Error: ' + error.message + '</p>';
      }
    }

    // Load Upcoming Tournaments
    async function loadUpcomingTournaments() {
      const list = document.getElementById('upcomingList');
      try {
        const snapshot = await db.collection('tournaments').where('status', '==', 'upcoming').get();
        
        if (snapshot.empty) {
          list.innerHTML = '<p style="color:#999;text-align:center;padding:2rem;">No upcoming tournaments</p>';
          return;
        }
        
        list.innerHTML = '';
        snapshot.forEach(doc => {
          const t = doc.data();
          list.innerHTML += `
            <div style="background:#1a1a1a;border:1px solid rgba(212,175,55,0.3);border-radius:1rem;padding:2rem;margin-bottom:1rem;text-align:center;transition:all 0.3s;">
              <i class="fas fa-calendar-alt" style="font-size:2.5rem;color:#d4af37;"></i>
              <h3 style="color:#f5f1e6;margin-top:1rem;font-size:1.2rem;">${t.name}</h3>
              <p style="color:#999;margin:0.5rem 0;">${t.startDate} - ${t.endDate}</p>
              <div style="width:50px;height:2px;background:#d4af37;margin:1rem auto;"></div>
              <p style="color:#666;font-size:0.85rem;">Stay tuned for the bracket</p>
            </div>
          `;
        });
      } catch (error) {
        list.innerHTML = '<p style="color:red;">Error</p>';
      }
    }

    // Load Past Tournament Brackets (Challonge iframe)
    async function loadPastBrackets() {
      const pastBrackets = document.getElementById('pastBrackets');
      try {
        const snapshot = await db.collection('tournaments').where('status', '==', 'completed').get();
        
        if (snapshot.empty) {
          pastBrackets.innerHTML = '<p style="color:#999;text-align:center;padding:2rem;">No past tournaments</p>';
          return;
        }
        
        pastBrackets.innerHTML = '';
        snapshot.forEach(doc => {
          const t = doc.data();
          if (t.challongeUrl) {
            let url = t.challongeUrl.trim().replace(/\/$/, '');
            if (!url.includes('/module')) url += '/module';
            
            pastBrackets.innerHTML += `
              <div style="background:#111;border:2px solid #d4af37;border-radius:1rem;overflow:hidden;margin-bottom:2rem;">
                <div style="padding:1rem;text-align:center;border-bottom:2px solid #d4af37;background:linear-gradient(135deg,#1a1a1a,#0b0b0b);">
                  <h3 style="color:#d4af37;margin:0;">🏆 ${t.name}</h3>
                  <p style="color:#999;margin:0.3rem 0 0;font-size:0.85rem;">${t.startDate} - ${t.endDate}</p>
                </div>
                <iframe src="${url}" width="100%" height="500" frameborder="0" scrolling="auto" allowtransparency="true" style="display:block;background:white;border:none;"></iframe>
              </div>
            `;
          }
        });
      } catch (error) {
        pastBrackets.innerHTML = '<p style="color:red;">Error</p>';
      }
    }

    function switchTab(tab, event) {
      document.getElementById('currentTab').style.display = 'none';
      document.getElementById('upcomingTab').style.display = 'none';
      document.getElementById('pastTab').style.display = 'none';
      document.getElementById(tab + 'Tab').style.display = 'block';
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');
    }

    // Initialize
    checkSession();
    loadCurrentTournament();
    loadUpcomingTournaments();
    loadPastBrackets();
  </script>
</body>
</html>
