<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAKS SYSTEM · MANAGEMENT</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  
  <!-- Firebase Config INLINE -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMKpB_BwOQ_KxwUKI9v-l3ND_n5FQQQbE",
      authDomain: "dsmanagement-bb22c.firebaseapp.com",
      projectId: "dsmanagement-bb22c",
      storageBucket: "dsmanagement-bb22c.firebasestorage.app",
      messagingSenderId: "917825703936",
      appId: "1:917825703936:web:657a3024ef2a66580d48e5"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    window.auth = auth;
    window.db = db;
    console.log('✅ Firebase ready');
  </script>
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="logo-area">
        <div class="logo-text">DAKS<span>.</span></div>
      </div>
      <div class="nav-links">
        <a href="#teams" class="nav-link">Teams</a>
        <a href="#achievements" class="nav-link">Achievements</a>
        <a href="#tournaments" class="nav-link">Tournaments</a>
      </div>
      <div class="nav-actions">
        <div class="founder-badge">FOUNDER · MYLYKES</div>
        <a href="login.html" class="login-link">Admin</a>
      </div>
    </nav>

    <header class="hero">
      <img src="DSBANNER.jpg" alt="Banner" style="width:100%;max-height:300px;object-fit:cover;border-radius:0 0 1rem 1rem;">
    </header>

    <div style="text-align:center;padding:2rem;">
      <h1>FORGE YOUR <span style="color:#d4af37;">LEGACY</span></h1>
    </div>

    <!-- TEAMS -->
    <section id="teams">
      <h2 class="section-title">TEAM BANNERS</h2>
      <div id="teamsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;">
        <p style="color:#999;">Loading teams...</p>
      </div>
    </section>

    <!-- TOURNAMENTS -->
    <section id="tournaments" style="margin-top:2rem;">
      <h2 class="section-title">TOURNAMENTS</h2>
      <div id="tournamentsList">
        <p style="color:#999;">Loading tournaments...</p>
      </div>
    </section>

    <footer style="text-align:center;padding:2rem;color:#666;">
      © 2025 DAKS SYSTEM
    </footer>
  </div>

  <script>
    // LOAD TEAMS
    async function loadTeams() {
      console.log('📊 Loading teams...');
      const grid = document.getElementById('teamsGrid');
      
      try {
        const snapshot = await db.collection('teams').get();
        console.log('Teams found:', snapshot.size);
        
        if (snapshot.empty) {
          grid.innerHTML = '<p style="color:#999;text-align:center;">No teams in database</p>';
          return;
        }
        
        grid.innerHTML = '';
        snapshot.forEach(doc => {
          const team = doc.data();
          console.log('Team:', team.name);
          
          const card = document.createElement('div');
          card.style.cssText = 'background:#1a1a1a;border:1px solid #d4af37;border-radius:0.5rem;overflow:hidden;cursor:pointer;';
          card.innerHTML = `
            <div style="height:150px;background:#111;display:flex;align-items:center;justify-content:center;border-bottom:2px solid #d4af37;">
              ${team.logoUrl ? `<img src="${team.logoUrl}" style="width:100%;height:100%;object-fit:cover;">` : '<span style="font-size:3rem;">🏆</span>'}
            </div>
            <div style="padding:1rem;text-align:center;">
              <h3 style="color:#d4af37;margin:0;">${team.name}</h3>
              <p style="color:#999;margin:0.5rem 0;">Captain: ${team.captain}</p>
              <p style="color:#d4af37;margin:0;">Wins: ${team.wins || 0} | Rating: ${team.rating || 0}</p>
            </div>
          `;
          grid.appendChild(card);
        });
        
        console.log('✅ Teams displayed');
      } catch (error) {
        console.error('Error:', error.message);
        grid.innerHTML = '<p style="color:red;">Error: ' + error.message + '</p>';
      }
    }
    
    // LOAD TOURNAMENTS
    async function loadTournaments() {
      console.log('📊 Loading tournaments...');
      const list = document.getElementById('tournamentsList');
      
      try {
        const snapshot = await db.collection('tournaments').get();
        console.log('Tournaments found:', snapshot.size);
        
        if (snapshot.empty) {
          list.innerHTML = '<p style="color:#999;text-align:center;">No tournaments</p>';
          return;
        }
        
        list.innerHTML = '';
        snapshot.forEach(doc => {
          const t = doc.data();
          console.log('Tournament:', t.name);
          
          const card = document.createElement('div');
          card.style.cssText = 'background:#1a1a1a;border:1px solid #d4af37;border-radius:0.5rem;padding:1rem;margin-bottom:0.5rem;';
          card.innerHTML = `
            <h3 style="color:#d4af37;margin:0;">🏆 ${t.name}</h3>
            <p style="color:#999;margin:0.5rem 0;">${t.startDate || 'TBD'} - ${t.endDate || 'TBD'}</p>
            <p style="color:#999;margin:0;">Status: ${t.status || 'unknown'}</p>
          `;
          list.appendChild(card);
        });
      } catch (error) {
        console.error('Error:', error.message);
        list.innerHTML = '<p style="color:red;">Error: ' + error.message + '</p>';
      }
    }
    
    // Run on load
    loadTeams();
    loadTournaments();
  </script>
</body>
</html>
