<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAKS SYSTEM · MANAGEMENT</title>
  <link rel="icon" type="image/png" href="DSLOGO.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="logo-area">
        <img src="DSLOGO.png" style="width:45px;height:45px;border-radius:8px;">
        <div class="logo-text">DAKS<span>.</span></div>
      </div>
      <div class="nav-links">
        <a href="#teams" class="nav-link">Teams</a>
        <a href="#achievements" class="nav-link">Achievements</a>
        <a href="#tournaments" class="nav-link">Tournaments</a>
        <a href="#register" class="nav-link">Register</a>
      </div>
      <div class="nav-actions">
        <div class="founder-badge">FOUNDER · MYLYKES</div>
        <a href="admin.html" class="login-link" id="adminPanelBtn" style="display:none;">Admin Panel</a>
        <a href="login.html" class="login-link" id="loginBtn">Admin</a>
      </div>
    </nav>

    <header class="hero">
      <img src="DSBANNER.jpg" style="width:100%;height:400px;object-fit:cover;border-radius:0 0 1.5rem 1.5rem;">
    </header>

    <div style="text-align:center;padding:2rem;">
      <h1 style="color:#f5f1e6;">FORGE YOUR <span style="color:#d4af37;">LEGACY</span></h1>
    </div>

    <section id="teams">
      <h2 class="section-title">TEAM BANNERS</h2>
      <div class="teams-grid" id="teamsGrid"></div>
    </section>

    <section id="tournaments">
      <h2 class="section-title">TOURNAMENTS</h2>
      <div id="tournamentsList"></div>
    </section>

    <section id="register">
      <h2 class="section-title">REGISTRATION</h2>
      <a href="https://docs.google.com/forms/d/1hhS8IsiMIJGG_-Xv9SyOH_R9wcWcnhMHddG3Gvohi8A/edit" target="_blank" class="google-form-btn">Register Now</a>
    </section>

    <footer class="footer">© 2025 DAKS SYSTEM</footer>
  </div>

  <script>
    // FIREBASE INIT
    const firebaseConfig = {
      apiKey: "AIzaSyCMKpB_BwOQ_KxwUKI9v-l3ND_n5FQQQbE",
      authDomain: "dsmanagement-bb22c.firebaseapp.com",
      projectId: "dsmanagement-bb22c",
      storageBucket: "dsmanagement-bb22c.firebasestorage.app",
      messagingSenderId: "917825703936",
      appId: "1:917825703936:web:657a3024ef2a66580d48e5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // CHECK SESSION
    const session = localStorage.getItem('daksSystemSession');
    if (session) {
      document.getElementById('adminPanelBtn').style.display = 'flex';
      document.getElementById('loginBtn').style.display = 'none';
    }

    // LOAD TEAMS
    db.collection('teams').get().then(snapshot => {
      const grid = document.getElementById('teamsGrid');
      if (snapshot.empty) {
        grid.innerHTML = '<p style="color:#999;">No teams yet</p>';
        return;
      }
      grid.innerHTML = '';
      snapshot.forEach(doc => {
        const team = doc.data();
        const card = document.createElement('div');
        card.className = 'team-card';
        card.innerHTML = `
          <div class="banner-placeholder">
            ${team.logoUrl ? `<img src="${team.logoUrl}" style="width:100%;height:100%;object-fit:cover;">` : '🏆'}
          </div>
          <div class="team-info">
            <div class="team-name">${team.name}</div>
            <p style="color:#999;">Captain: ${team.captain}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }).catch(error => {
      document.getElementById('teamsGrid').innerHTML = '<p style="color:red;">Error: ' + error.message + '</p>';
    });

    // REAL-TIME UPDATE
    db.collection('teams').onSnapshot(snapshot => {
      const grid = document.getElementById('teamsGrid');
      grid.innerHTML = '';
      snapshot.forEach(doc => {
        const team = doc.data();
        const card = document.createElement('div');
        card.className = 'team-card';
        card.innerHTML = `
          <div class="banner-placeholder">
            ${team.logoUrl ? `<img src="${team.logoUrl}" style="width:100%;height:100%;object-fit:cover;">` : '🏆'}
          </div>
          <div class="team-info">
            <div class="team-name">${team.name}</div>
            <p style="color:#999;">Captain: ${team.captain}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    });
  </script>
</body>
</html>
