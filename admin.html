<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAKS SYSTEM · ADMIN DASHBOARD</title>
  <link rel="icon" type="image/png" href="DSLOGO.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="admin-styles.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  
  <!-- Firebase Config INLINE -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMKpB_BwOQ_KxwUKI9v-l3ND_n5FQQQbE",
      authDomain: "dsmanagement-bb22c.firebaseapp.com",
      projectId: "dsmanagement-bb22c",
      storageBucket: "dsmanagement-bb22c.firebasestorage.app",
      messagingSenderId: "917825703936",
      appId: "1:917825703936:web:657a3024ef2a66580d48e5"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    window.auth = auth;
    window.db = db;
    console.log('✅ Firebase ready');
  </script>
</head>
<body>
  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <i class="fas fa-crown"></i>
        <span>DAKS SYSTEM</span>
        <small>ADMIN</small>
      </div>
      <nav class="admin-nav">
        <a href="#dashboard" class="admin-nav-link active" onclick="showSection('dashboard', event)">
          <i class="fas fa-chart-line"></i> Dashboard
        </a>
        <a href="#teams" class="admin-nav-link" onclick="showSection('teams', event)">
          <i class="fas fa-users"></i> Teams
        </a>
        <a href="#certificates" class="admin-nav-link" onclick="showSection('certificates', event)">
          <i class="fas fa-certificate"></i> Certificates
        </a>
        <a href="#tournaments" class="admin-nav-link" onclick="showSection('tournaments', event)">
          <i class="fas fa-trophy"></i> Tournaments
        </a>
      </nav>
      <div class="admin-footer">
        <a href="index.html" class="back-to-site">
          <i class="fas fa-arrow-left"></i> Back to Website
        </a>
        <button onclick="logout()" class="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="admin-profile">
          <span id="adminName">Admin</span>
          <i class="fas fa-user-shield"></i>
        </div>
      </header>

      <!-- Dashboard -->
      <section id="dashboard" class="admin-section active">
        <div class="stats-grid">
          <div class="stat-card">
            <i class="fas fa-users stat-icon"></i>
            <div class="stat-info"><h3 id="totalTeams">0</h3><p>Teams</p></div>
          </div>
          <div class="stat-card">
            <i class="fas fa-certificate stat-icon"></i>
            <div class="stat-info"><h3 id="totalCertificates">0</h3><p>Certificates</p></div>
          </div>
        </div>
      </section>

      <!-- Teams -->
      <section id="teams" class="admin-section">
        <div class="section-header">
          <h2>Teams Management</h2>
          <button class="btn-primary" onclick="openTeamModal()"><i class="fas fa-plus"></i> Add Team</button>
        </div>
        <table class="admin-table">
          <thead><tr><th>Banner</th><th>Team Name</th><th>Captain</th><th>Actions</th></tr></thead>
          <tbody id="teamsTableBody"></tbody>
        </table>
      </section>

      <!-- Certificates -->
      <section id="certificates" class="admin-section">
        <div class="section-header">
          <h2>Certificate Management</h2>
          <button class="btn-primary" onclick="openCertificateModal()"><i class="fas fa-plus"></i> Upload Certificate</button>
        </div>
        <div class="certificates-grid" id="certificatesGrid"></div>
      </section>

      <!-- Tournaments -->
      <section id="tournaments" class="admin-section">
        <div class="section-header">
          <h2>Tournament Management</h2>
          <button class="btn-primary" onclick="openTournamentModal()"><i class="fas fa-plus"></i> Create Tournament</button>
        </div>
        <div class="tournaments-list" id="tournamentsList"></div>
      </section>
    </main>
  </div>

  <!-- Team Modal -->
  <div id="teamModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('teamModal')">&times;</span>
      <h2>Add Team</h2>
      <form id="teamForm">
        <div class="form-group">
          <label>Team Banner Logo</label>
          <input type="file" id="teamLogoInput" accept="image/*" onchange="previewTeamLogo(event)" style="display:none;">
          <img id="teamLogoPreview" style="display:none;width:100%;max-height:150px;object-fit:contain;margin-bottom:0.5rem;border-radius:10px;border:2px solid #d4af37;">
          <button type="button" class="btn-primary" onclick="document.getElementById('teamLogoInput').click()">
            <i class="fas fa-upload"></i> Upload Team Banner
          </button>
        </div>
        <div class="form-group"><label>Team Name</label><input type="text" id="teamNameInput" required placeholder="Enter team name"></div>
        <div class="form-group"><label>Captain</label><input type="text" id="captainNameInput" required placeholder="Enter captain name"></div>
        <div class="form-group"><label>Members (comma separated)</label><input type="text" id="teamMembersInput" placeholder="Player1, Player2, Player3"></div>
        <button type="submit" class="btn-primary">Save Team</button>
      </form>
    </div>
  </div>

  <!-- Certificate Modal -->
  <div id="certificateModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('certificateModal')">&times;</span>
      <h2>Upload Certificate</h2>
      <form id="certificateForm">
        <div class="form-group">
          <label>Certificate Image (Your design)</label>
          <input type="file" id="certImageInput" accept="image/*" onchange="previewCertImage(event)">
          <img id="certImagePreview" style="display:none;width:100%;max-height:200px;object-fit:contain;margin-top:0.5rem;border-radius:10px;border:2px solid #d4af37;">
        </div>
        <div class="form-group"><label>Winning Team Name</label><input type="text" id="certTeamName" required></div>
        <div class="form-group"><label>Achievement Title</label><input type="text" id="certTitle" required placeholder="e.g., Champion"></div>
        <button type="submit" class="btn-primary">Upload Certificate</button>
      </form>
    </div>
  </div>

  <!-- Tournament Modal -->
  <div id="tournamentModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('tournamentModal')">&times;</span>
      <h2>Create Tournament</h2>
      <form id="tournamentForm">
        <div class="form-group"><label>Tournament Name</label><input type="text" id="tournamentNameInput" required></div>
        <div class="form-group"><label>Challonge URL</label><input type="url" id="challongeUrlInput" placeholder="https://challonge.com/..."></div>
        <div class="form-group"><label>Start Date</label><input type="date" id="tournamentStartDate" required></div>
        <div class="form-group"><label>End Date</label><input type="date" id="tournamentEndDate" required></div>
        <div class="form-group">
          <label>Status</label>
          <select id="tournamentStatus">
            <option value="upcoming">Upcoming</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Create Tournament</button>
      </form>
    </div>
  </div>

  <script>
    let teamLogoData = null;
    let certImageData = null;

    // Session check
    const session = localStorage.getItem('daksSystemSession');
    if (!session) {
      window.location.replace('login.html');
    } else {
      document.getElementById('adminName').textContent = JSON.parse(session).name || 'Admin';
    }

    // PREVIEW TEAM LOGO
    function previewTeamLogo(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        teamLogoData = e.target.result;
        document.getElementById('teamLogoPreview').src = e.target.result;
        document.getElementById('teamLogoPreview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    // PREVIEW CERTIFICATE
    function previewCertImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        certImageData = e.target.result;
        document.getElementById('certImagePreview').src = e.target.result;
        document.getElementById('certImagePreview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    // LOAD TEAMS
    function loadTeams() {
      db.collection('teams').get().then(snapshot => {
        document.getElementById('totalTeams').textContent = snapshot.size;
        const tbody = document.getElementById('teamsTableBody');
        tbody.innerHTML = '';
        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="4" style="color:#999;">No teams yet</td></tr>';
          return;
        }
        snapshot.forEach(doc => {
          const team = doc.data();
          tbody.innerHTML += `
            <tr>
              <td>${team.logoUrl ? `<img src="${team.logoUrl}" style="width:50px;height:50px;object-fit:cover;border-radius:10px;">` : '🏆'}</td>
              <td style="color:white;font-weight:600;">${team.name}</td>
              <td style="color:#999;">${team.captain}</td>
              <td><button class="btn-danger" onclick="deleteTeam('${doc.id}')">Delete</button></td>
            </tr>
          `;
        });
      });
    }

    // LOAD CERTIFICATES
    function loadCertificates() {
      db.collection('certificates').get().then(snapshot => {
        document.getElementById('totalCertificates').textContent = snapshot.size;
        const grid = document.getElementById('certificatesGrid');
        grid.innerHTML = '';
        if (snapshot.empty) {
          grid.innerHTML = '<p style="color:#999;">No certificates yet</p>';
          return;
        }
        snapshot.forEach(doc => {
          const cert = doc.data();
          grid.innerHTML += `
            <div class="certificate-card">
              ${cert.imageUrl ? `<img src="${cert.imageUrl}" style="width:100%;max-height:200px;object-fit:contain;border-radius:10px;margin-bottom:1rem;">` : ''}
              <h3 class="certificate-title">${cert.title}</h3>
              <p class="certificate-team">🏆 ${cert.teamName}</p>
              <button class="btn-danger" onclick="deleteCertificate('${doc.id}')">Delete</button>
            </div>
          `;
        });
      });
    }

    // LOAD TOURNAMENTS
    function loadTournaments() {
      db.collection('tournaments').get().then(snapshot => {
        const list = document.getElementById('tournamentsList');
        list.innerHTML = '';
        if (snapshot.empty) {
          list.innerHTML = '<p style="color:#999;">No tournaments yet</p>';
          return;
        }
        snapshot.forEach(doc => {
          const t = doc.data();
          list.innerHTML += `
            <div class="tournament-card">
              <div class="tournament-info">
                <h3>🏆 ${t.name}</h3>
                <p>${t.startDate} - ${t.endDate}</p>
                ${t.challongeUrl ? `<p style="color:#d4af37;font-size:0.8rem;">🔗 ${t.challongeUrl}</p>` : ''}
              </div>
              <span class="tournament-status status-${t.status}">${t.status}</span>
              <button class="btn-danger" onclick="deleteTournament('${doc.id}')">Delete</button>
            </div>
          `;
        });
      });
    }

    // SAVE TEAM
    document.getElementById('teamForm').addEventListener('submit', function(e) {
      e.preventDefault();
      db.collection('teams').add({
        name: document.getElementById('teamNameInput').value,
        captain: document.getElementById('captainNameInput').value,
        members: document.getElementById('teamMembersInput').value.split(',').map(m => m.trim()).filter(m => m),
        logoUrl: teamLogoData || null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        closeModal('teamModal');
        alert('✅ Team added!');
        this.reset();
        teamLogoData = null;
        document.getElementById('teamLogoPreview').style.display = 'none';
        loadTeams();
      });
    });

    // SAVE CERTIFICATE
    document.getElementById('certificateForm').addEventListener('submit', function(e) {
      e.preventDefault();
      db.collection('certificates').add({
        imageUrl: certImageData || null,
        teamName: document.getElementById('certTeamName').value,
        title: document.getElementById('certTitle').value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        closeModal('certificateModal');
        alert('✅ Certificate uploaded!');
        this.reset();
        certImageData = null;
        document.getElementById('certImagePreview').style.display = 'none';
        loadCertificates();
      });
    });

    // SAVE TOURNAMENT
    document.getElementById('tournamentForm').addEventListener('submit', function(e) {
      e.preventDefault();
      db.collection('tournaments').add({
        name: document.getElementById('tournamentNameInput').value,
        challongeUrl: document.getElementById('challongeUrlInput').value || null,
        startDate: document.getElementById('tournamentStartDate').value,
        endDate: document.getElementById('tournamentEndDate').value,
        status: document.getElementById('tournamentStatus').value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        closeModal('tournamentModal');
        alert('✅ Tournament created!');
        this.reset();
        loadTournaments();
      });
    });

    // DELETE FUNCTIONS
    function deleteTeam(id) { if (confirm('Delete this team?')) db.collection('teams').doc(id).delete().then(() => loadTeams()); }
    function deleteCertificate(id) { if (confirm('Delete this certificate?')) db.collection('certificates').doc(id).delete().then(() => loadCertificates()); }
    function deleteTournament(id) { if (confirm('Delete this tournament?')) db.collection('tournaments').doc(id).delete().then(() => loadTournaments()); }

    // MODAL FUNCTIONS
    function openTeamModal() {
      document.getElementById('teamModal').style.display = 'block';
      document.getElementById('teamForm').reset();
      teamLogoData = null;
      document.getElementById('teamLogoPreview').style.display = 'none';
      document.getElementById('teamLogoInput').value = '';
    }
    function openCertificateModal() {
      document.getElementById('certificateModal').style.display = 'block';
      document.getElementById('certificateForm').reset();
      certImageData = null;
      document.getElementById('certImagePreview').style.display = 'none';
    }
    function openTournamentModal() {
      document.getElementById('tournamentModal').style.display = 'block';
      document.getElementById('tournamentForm').reset();
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // SECTION SWITCHING
    function showSection(sectionName, event) {
      document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
      document.getElementById(sectionName).classList.add('active');
      document.querySelectorAll('.admin-nav-link').forEach(l => l.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');
      document.getElementById('pageTitle').textContent = sectionName.charAt(0).toUpperCase() + sectionName.slice(1);
    }

    // LOGOUT
    function logout() {
      localStorage.removeItem('daksSystemSession');
      auth.signOut().catch(() => {});
      window.location.replace('login.html');
    }

    // INITIALIZE
    loadTeams();
    loadCertificates();
    loadTournaments();
  </script>
</body>
</html>
